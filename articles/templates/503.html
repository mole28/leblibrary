{% extends "articles/base.html" %}

{% block title %}שירות לא זמין | ספריית לייבוביץ{% endblock %}

{% block content %}
<style>
    .error-page-wrapper { position: relative; min-height: 60vh; display: flex; align-items: center; justify-content: center; padding: 4rem 1rem; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background-color: #fafafa; }
    .watermark-bg { position: absolute; font-size: 28vw; font-weight: 900; color: rgba(0, 0, 0, 0.015); z-index: 0; user-select: none; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    .error-content { position: relative; z-index: 1; max-width: 600px; width: 100%; text-align: center; animation: fadeIn 0.8s ease-out; }
    .error-title { color: #3f4050; font-size: 3.5rem; font-weight: 400; margin-bottom: 1rem; }
    .error-subtitle { color: #555; font-size: 1.25rem; margin-bottom: 1.5rem; line-height: 1.6; }
    .action-buttons { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 2rem; }
    .btn-solid { display: inline-flex; align-items: center; background-color: #3f4050; color: white; border: 2px solid #3f4050; padding: 10px 30px; border-radius: 30px; text-decoration: none; font-weight: 600; font-size: 1.1rem; transition: all 0.3s; cursor: pointer; }
    .btn-solid:hover { background-color: #2c2d38; border-color: #2c2d38; color: white; box-shadow: 0 5px 15px rgba(63, 64, 80, 0.2); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
</style>

<div class="error-page-wrapper">
    <div class="watermark-bg">503</div>
    <div class="error-content">
        <h1 class="error-title">עומס זמני</h1>
        <p class="error-subtitle">
            הספרייה כרגע בעומס פניות חריג או תחת תחזוקה טכנית קצרה.<br>
            אנו עובדים כדי להחזיר את האתר לפעילות מלאה בהקדם האפשרי.
        </p>
        
        <div class="action-buttons">
            <button onclick="window.location.reload();" class="btn-solid">
                <i class="bi bi-arrow-clockwise me-2"></i> נסה שוב כעת
            </button>
        </div>
    </div>
</div>
{% endblock %}
