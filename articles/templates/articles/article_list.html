    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-lg p-5 border-0" style="border-radius: 20px; background: linear-gradient(to bottom, #ffffff, #fdfbf7);">
                <div class="mb-4">
                    <h1 class="display-1" style="color: #d4af37;">🚧</h1>

                    ספריית לייבוביץ מתחדשת עבורכם. תודה על ההבנה והסבלנות.
