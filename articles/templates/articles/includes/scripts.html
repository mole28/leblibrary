    function applyLanguage(lang) {
        localStorage.setItem('site_lang', lang); document.documentElement.lang = lang;
        const isRtl = (lang === 'he'); document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
        const bsLink = document.getElementById('bootstrap-css');
        if (isRtl) { bsLink.href = 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css'; } 
        else { bsLink.href = 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css'; }
        const flagImg = document.getElementById('lang-flag-img'); const langText = document.getElementById('lang-text');
        if (isRtl) { flagImg.src = 'https://upload.wikimedia.org/wikipedia/commons/a/a4/Flag_of_the_United_States.svg'; flagImg.alt = 'English'; langText.innerText = 'אנגלית'; } 
        else { flagImg.src = 'https://upload.wikimedia.org/wikipedia/commons/d/d4/Flag_of_Israel.svg'; flagImg.alt = 'Hebrew'; langText.innerText = 'Hebrew'; }
        document.querySelectorAll('[data-i18n]').forEach(el => { const key = el.getAttribute('data-i18n'); if (i18n_dict[lang][key]) { el.innerHTML = i18n_dict[lang][key]; } });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const key = el.getAttribute('data-i18n-placeholder'); if (i18n_dict[lang][key]) { el.placeholder = i18n_dict[lang][key]; } });
    }
    function toggleLanguage() { const currentLang = localStorage.getItem('site_lang') || 'he'; const newLang = currentLang === 'he' ? 'en' : 'he'; applyLanguage(newLang); }
    function toggleDarkMode() {
        const body = document.body;
        if (body.classList.contains('dark-mode')) { body.classList.remove('dark-mode'); localStorage.setItem('site_theme', 'light'); } 
        else { body.classList.add('dark-mode'); localStorage.setItem('site_theme', 'dark'); }
    }

    function openShareModal() {
        const shareData = {
            title: document.title,
            text: 'קראו את התוכן המרתק בספריית לייבוביץ:',
            url: window.location.href
        };

        if (navigator.share) {
            navigator.share(shareData).catch(() => {});
        } else {
            const currentUrl = window.location.href;
            const titleEncoded = encodeURIComponent(document.title);
            const urlEncoded = encodeURIComponent(currentUrl);

            document.getElementById('luxShareUrl').value = currentUrl;
            document.getElementById('shareWhatsapp').href = `https://api.whatsapp.com/send?text=${titleEncoded}%20-%20${urlEncoded}`;
            document.getElementById('shareEmail').href = `mailto:?subject=${titleEncoded}&body=מוזמנים לקרוא:%20${urlEncoded}`;
            document.getElementById('shareFacebook').href = `https://www.facebook.com/sharer/sharer.php?u=${urlEncoded}`;

    function copyShareUrl() {
        const urlInput = document.getElementById('luxShareUrl');
        urlInput.select();
        urlInput.setSelectionRange(0, 99999);
        
        navigator.clipboard.writeText(urlInput.value).then(() => {

            copyText.innerText = 'הועתק בהצלחה!';

            setTimeout(() => {
                copyText.innerText = 'העתק קישור';

    async function sendGlobalNavMessage() {
        const inputField = document.getElementById('globalNavInput'); 
        const chatBox = document.getElementById('globalNavChatBox'); 
        const userText = inputField.value.trim();
        
        if (userText === '') return;
        
        chatBox.innerHTML += `<div class="nav-chat-bubble nav-chat-user">${userText}</div>`; 
        inputField.value = ''; 
        chatBox.scrollTop = chatBox.scrollHeight;
        
        const typingId = 'nav-typing-' + Date.now(); 
        const aiTitle = '<strong style="font-size: 1.15em; color: #2575fc;">עוזר הניווט הדיגיטלי:</strong><br><br>';
        
        chatBox.innerHTML += `<div class="nav-chat-bubble nav-chat-bot" id="${typingId}">${aiTitle} <div class="nav-loading-status"><div class="nav-spinner" style="border-top-color: #2575fc;"></div><span id="nav-status-text-${typingId}">מאתר את העמוד הרלוונטי...</span></div></div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
        
        try {
            const response = await fetch('/api/ai-chat/', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ question: userText, mode: 'nav' }) 
            });
            
            if (!response.ok) { 
                document.getElementById(typingId).innerHTML = `${aiTitle}מצטער, הייתה בעיה זמנית בעיבוד השאלה.`; 
                return; 
            }
            
            document.getElementById(typingId).innerHTML = aiTitle;
            
            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let done = false;
            
            while (!done) {
                const { value, done: readerDone } = await reader.read();
                done = readerDone;
                if (value) {
                    const chunk = decoder.decode(value, { stream: true });
                    document.getElementById(typingId).innerHTML += chunk.replace(/\n/g, '<br>');
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            }
        } catch (error) { 
            document.getElementById(typingId).innerHTML = `${aiTitle}מצטער, אירעה שגיאת רשת זמנית.`; 
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendQAMessage() {
        const inputField = document.getElementById('globalQAInput'); 
        const chatBox = document.getElementById('globalQAChatBox'); 
        const userText = inputField.value.trim();
        
        if (userText === '') return;
        
        chatBox.innerHTML += `<div class="nav-chat-bubble qa-chat-user">${userText}</div>`; 
        inputField.value = '';

        const typingId = 'qa-typing-' + Date.now(); 
        const aiTitle = '<strong style="font-size: 1.15em; color: #1e202c;">שאל את ה-AI מבוסס על התכנים שבאתר <span style="font-weight: normal; font-size: 0.85em;">(אין לסמוך על תשובות ה- AI למעשה)</span>:</strong><br><br>';
        
        chatBox.innerHTML += `<div class="nav-chat-bubble qa-chat-bot" id="${typingId}">${aiTitle} <div class="nav-loading-status" style="color: #d4af37;"><div class="nav-spinner" style="border-top-color: #d4af37;"></div><span id="qa-status-text-${typingId}">🧠 מנתח את ההקשר ההלכתי של הטקסט...</span></div></div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
        
        const loadingMessages = ["🧠 מנתח את ההקשר ההלכתי של הטקסט...", "📚 סורק מקורות ופסקי הלכה...", "✍️ מנסח תשובה ברורה ומדויקת..."]; 
        let messageIndex = 0;
        const loadingInterval = setInterval(() => { 
            messageIndex = (messageIndex + 1) % loadingMessages.length; 
            const statusElement = document.getElementById(`qa-status-text-${typingId}`); 
            if (statusElement) { statusElement.innerText = loadingMessages[messageIndex]; } 
        }, 2000);
        
        try {
            const response = await fetch('/api/ai-chat/', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ question: userText, mode: 'qa' }) 
            });
            
            clearInterval(loadingInterval);
            
            if (!response.ok) { 
                document.getElementById(typingId).innerHTML = `${aiTitle}מצטער, הייתה בעיה זמנית בעיבוד השאלה.`; 
                return; 
            }
            
            document.getElementById(typingId).innerHTML = aiTitle;
            
            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let done = false;
            
            while (!done) {
                const { value, done: readerDone } = await reader.read();
                done = readerDone;
                if (value) {
                    const chunk = decoder.decode(value, { stream: true });
                    document.getElementById(typingId).innerHTML += chunk.replace(/\n/g, '<br>');
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            }
        } catch (error) { 
            clearInterval(loadingInterval); 
            document.getElementById(typingId).innerHTML = `${aiTitle}מצטער, אירעה שגיאת רשת זמנית.`; 
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem('site_lang') || 'he';
        if(savedLang !== 'he') { applyLanguage(savedLang); }
        const savedTheme = localStorage.getItem('site_theme');
        if (savedTheme === 'dark') { document.body.classList.add('dark-mode'); }
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        window.addEventListener('scroll', function() { if (window.pageYOffset > 300) { scrollTopBtn.classList.add('show'); } else { scrollTopBtn.classList.remove('show'); } });
        scrollTopBtn.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });
        const observerOptions = { root: null, rootMargin: '0px', threshold: 0.1 };
        const observer = new IntersectionObserver((entries, observer) => { entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('is-visible'); observer.unobserve(entry.target); } }); }, observerOptions);
        document.querySelectorAll('.reveal-up').forEach((el) => { observer.observe(el); });
        
        const dragEl = document.getElementById('draggableQaPill');
        let isDragging = false, isClick = true;
        let currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;
        
        function dragStart(e) {
            if (e.type === "touchstart") { initialX = e.touches[0].clientX - xOffset; initialY = e.touches[0].clientY - yOffset; } 
            else { initialX = e.clientX - xOffset; initialY = e.clientY - yOffset; }
            if (e.target === dragEl || dragEl.contains(e.target)) {
                isDragging = true; isClick = true;
            }
        }

        function dragEnd(e) {
            initialX = currentX; initialY = currentY; isDragging = false;
        }

        function drag(e) {
            if (isDragging) {
                e.preventDefault(); isClick = false; 
                if (e.type === "touchmove") { currentX = e.touches[0].clientX - initialX; currentY = e.touches[0].clientY - initialY; } 
                else { currentX = e.clientX - initialX; currentY = e.clientY - initialY; }
                xOffset = currentX; yOffset = currentY;
                setTranslate(currentX, currentY, dragEl);
            }
        }

        function setTranslate(xPos, yPos, el) { el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`; }

        document.addEventListener("touchstart", dragStart, {passive: false});
        document.addEventListener("touchend", dragEnd, {passive: false});
        document.addEventListener("touchmove", drag, {passive: false});

        document.addEventListener("mousedown", dragStart);
        document.addEventListener("mouseup", dragEnd);
        document.addEventListener("mousemove", drag);
        
        dragEl.addEventListener('click', function(e) {
            if (isClick) {
                var aiModal = new bootstrap.Modal(document.getElementById('aiQAModal'));
                aiModal.show();
            } else {
                e.preventDefault(); e.stopPropagation();
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(function(registration) {
                console.log('ServiceWorker registered with scope:', registration.scope);
            }).catch(function(err) {
                console.log('ServiceWorker registration failed:', err);
            });
        }

        var aiModal = document.getElementById('aiQAModal');
        if (aiModal) {
            aiModal.addEventListener('hide.bs.modal', function () {
                if (document.activeElement) { document.activeElement.blur(); }
            });
        }
        var navModal = document.getElementById('aiGlobalNavModal');
        if (navModal) {
            navModal.addEventListener('hide.bs.modal', function () {
                if (document.activeElement) { document.activeElement.blur(); }
            });
        }
        var shareModal = document.getElementById('luxShareModal');
        if (shareModal) {
            shareModal.addEventListener('hide.bs.modal', function () {
                if (document.activeElement) { document.activeElement.blur(); }
            });
        }
    });

    window.addEventListener('scroll', function() {
        const winScroll = document.body.scrollTop || document.documentElement.scrollTop; const height = document.documentElement.scrollHeight - document.documentElement.clientHeight; let scrolled = 0;
        if (height > 0) { scrolled = (winScroll / height) * 100; }
        const progressBar = document.getElementById("reading-progress-bar"); if (progressBar) { progressBar.style.width = scrolled + "%"; }
    });
</script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const popup = document.createElement('div');
        popup.className = 'lux-footnote-popup';
        document.body.appendChild(popup);

        let activeLink = null;

        const footnoteLinks = document.querySelectorAll('a[href^="#"]');

        footnoteLinks.forEach(link => {
            const targetId = link.getAttribute('href').substring(1);
            if (!targetId) return;
            
            const targetElement = document.getElementById(targetId) || document.querySelector(`a[name="${targetId}"]`);

            if (targetElement) {
                const showPopup = (e) => {
                    let contentNode = targetElement;
                    
                    if (targetElement.tagName.toLowerCase() === 'a' || targetElement.tagName.toLowerCase() === 'span') {
                        if (targetElement.parentElement && targetElement.parentElement.innerText.length > targetElement.innerText.length) {
                            contentNode = targetElement.parentElement;
                        }
                    }

                    let clone = contentNode.cloneNode(true);
                    
                    const backLinks = clone.querySelectorAll('a[href^="#"]');
                    backLinks.forEach(bl => bl.remove());
                    
                    popup.innerHTML = clone.innerHTML.trim();
                    activeLink = link;

                    const rect = link.getBoundingClientRect();
                    
                    let top = rect.top + window.scrollY - popup.offsetHeight - 15;
                    let left = rect.left + window.scrollX + (rect.width / 2) - (popup.offsetWidth / 2);
                    
                    if (top < window.scrollY) {
                        top = rect.bottom + window.scrollY + 15;
                    }
                    
                    if (left < 10) left = 10;
                    if (left + popup.offsetWidth > window.innerWidth - 10) {
                        left = window.innerWidth - popup.offsetWidth - 10;
                    }

                    popup.style.top = top + 'px';
                    popup.style.left = left + 'px';
                    popup.classList.add('show');
                };

                const hidePopup = () => {
                    popup.classList.remove('show');
                    activeLink = null;
                };

                link.addEventListener('mouseenter', showPopup);
                link.addEventListener('mouseleave', hidePopup);

                link.addEventListener('click', (e) => {
                    if (activeLink !== link) {
                        e.preventDefault(); 
                        showPopup(e);
                    } else {
                        hidePopup();
                    }
                });
            }
        });

        document.addEventListener('click', (e) => {
            if (activeLink && !activeLink.contains(e.target) && !popup.contains(e.target)) {
                popup.classList.remove('show');
                activeLink = null;
            }
        });
        
        window.addEventListener('scroll', () => {
            if (popup.classList.contains('show') && activeLink) {
                popup.classList.remove('show');
                activeLink = null;
            }
        }, { passive: true });
    });
</script>

            'וז"ל': 'וזה לשונו',
            'ל"ת': 'לא תעשה',
            'מ"ע': 'מצות עשה',
            'הל\'': 'הלכה / הלכות',
            'ב"ק': 'בבא קמא',
            'ב"מ': 'בבא מציעא',
            'ב"ב': 'בבא בתרא',
            'סנ\'': 'סנהדרין',
            'פס\'': 'פסחים',
            'מו"ק': 'מועד קטן',
            'ר"ע': 'רבי עקיבא',
            'ר"מ': 'רבי מאיר',
            'ר"ל': 'ריש לקיש'
        };

        const hebrewPrefixes = ['ו', 'ב', 'ל', 'מ', 'ש', 'ה', 'וכ', 'וש', 'מה', 'שה', 'לכש'];

        function walkTextNodes(node) {
            let next;
            if (node.nodeType === 1) {
                const tag = node.nodeName;
                if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'A' || node.classList.contains('lux-acronym')) {
                    return;
                }
                for (let child = node.firstChild; child; child = next) {
                    next = child.nextSibling;
                    walkTextNodes(child);
                }
            } else if (node.nodeType === 3) {
                const text = node.nodeValue;
                const regex = /([א-ת]+["'״”“]+[א-ת]+|[א-ת]+['׳`])/g;
                let match;
                let lastIndex = 0;
                let hasMatch = false;
                const fragment = document.createDocumentFragment();

                while ((match = regex.exec(text)) !== null) {
                    let word = match[0];
                    let normalizedWord = word.replace(/['׳`]/g, "'").replace(/["״”“]/g, '"');
                    let meaning = acronymDict[normalizedWord];
                    
                    if (!meaning && normalizedWord.length > 2) {
                        for (let prefix of hebrewPrefixes) {
                            if (normalizedWord.startsWith(prefix) && acronymDict[normalizedWord.substring(prefix.length)]) {
                                meaning = acronymDict[normalizedWord.substring(prefix.length)];
                                break;
                            }
                        }
                    }

                    if (meaning) {
                        hasMatch = true;
                        fragment.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));
                        
                        const span = document.createElement('span');
                        span.className = 'lux-acronym';
                        span.setAttribute('data-meaning', meaning);
                        span.textContent = word;
                        fragment.appendChild(span);
                        
                        lastIndex = regex.lastIndex;
                    }
                }
                
                if (hasMatch) {
                    fragment.appendChild(document.createTextNode(text.substring(lastIndex)));
                    node.parentNode.replaceChild(fragment, node);
                }
            }
        }

        const contentAreas = document.querySelectorAll('.article-content');
        contentAreas.forEach(area => walkTextNodes(area));
    });
</script>
