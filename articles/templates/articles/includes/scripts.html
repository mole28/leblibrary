    const i18n_dict = {
        'he': { 'site_title': 'דף הבית', 'nav_books': 'ספרים', 'nav_qa': 'שאלות ותשובות', 'nav_articles': 'מאמרים', 'nav_parasha': 'פרשת שבוע', 'nav_contact': 'צור קשר', 'footer_rights': 'כל הזכויות שמורות<br>למשה לייבוביץ', 'search_placeholder': 'חיפוש באתר', 'search_btn': 'חיפוש', 'home_latest_articles': 'מאמרים אחרונים', 'home_published': 'פורסם בתאריך:', 'home_read_more': 'קרא עוד', 'home_no_articles': 'אין מאמרים להצגה כרגע.', 'home_calc_title': 'מחשבוני מידות התורה וחז"ל', 'home_calc_desc': 'כלי עזר מהיר ואלגנטי להמרת מידות אורך, נפח, ומשקל מטבעות למידות ההלכתיות לפי השיעור המדוייק.', 'home_calc_length': 'מחשבון מידות אורך', 'home_calc_volume': 'מחשבון מידות נפח', 'home_calc_weight': 'מחשבון משקל ומטבעות', 'search_results_for': 'תוצאות חיפוש עבור:', 'search_found': 'נמצאו', 'search_articles': 'תוצאות התואמות לחיפוש שלך', 'search_clear': 'נקה חיפוש וחזור', 'search_no_results_title': 'לא נמצאו מאמרים', 'search_no_results_desc': 'נסה מילת חיפוש אחרת.', 'acc_title': 'נגישות', 'acc_info': 'מידע והגדרות', 'acc_reset': 'איפוס כל הגדרות הנגישות', 'acc_text_size': 'גודל טקסט', 'acc_zoom_in': 'הגדל טקסט', 'acc_zoom_out': 'הקטן טקסט', 'acc_reset_text': 'איפוס גודל טקסט', 'acc_colors': 'צבעים', 'acc_contrast': 'ניגודיות גבוהה', 'acc_invert': 'היפוך צבעים', 'acc_display': 'תצוגה', 'acc_font': 'פונט קריא (גופן בסיסי)', 'acc_highlight': 'הדגשה', 'acc_hl_links': 'הדגשת קישורים', 'acc_hl_headers': 'הדגשת כותרות' },
        'en': { 'site_title': 'Home Page', 'nav_books': 'Books', 'nav_qa': 'Q&A', 'nav_articles': 'Articles', 'nav_parasha': 'Weekly Torah', 'nav_contact': 'Contact Us', 'footer_rights': 'All rights reserved<br>to Moshe Leibowitz', 'search_placeholder': 'Search the site...', 'search_btn': 'Search', 'home_latest_articles': 'Latest Articles', 'home_published': 'Published on:', 'home_read_more': 'Read More', 'home_no_articles': 'No articles to display currently.', 'home_calc_title': 'Torah & Chazal Calculators', 'home_calc_desc': 'A fast and elegant tool for converting length, volume, and weight to their exact Halachic measurements.', 'home_calc_length': 'Length Calculator', 'home_calc_volume': 'Volume Calculator', 'home_calc_weight': 'Weight & Coins Calculator', 'search_results_for': 'Search results for:', 'search_found': 'Found', 'search_articles': 'matching results', 'search_clear': 'Clear search & return', 'search_no_results_title': 'No articles found', 'search_no_results_desc': 'Try a different search term.', 'acc_title': 'Accessibility', 'acc_info': 'Info & Settings', 'acc_reset': 'Reset all settings', 'acc_text_size': 'Text Size', 'acc_zoom_in': 'Zoom In', 'acc_zoom_out': 'Zoom Out', 'acc_reset_text': 'Reset Text Size', 'acc_colors': 'Colors', 'acc_contrast': 'High Contrast', 'acc_invert': 'Invert Colors', 'acc_display': 'Display', 'acc_font': 'Readable Font', 'acc_highlight': 'Highlight', 'acc_hl_links': 'Highlight Links', 'acc_hl_headers': 'Highlight Headers' }
    };

    function applyLanguage(lang) {
        localStorage.setItem('site_lang', lang); document.documentElement.lang = lang;
        const isRtl = (lang === 'he'); document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
        const bsLink = document.getElementById('bootstrap-css');
        if (isRtl) { bsLink.href = 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css'; } 
        else { bsLink.href = 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css'; }
        const flagImg = document.getElementById('lang-flag-img'); const langText = document.getElementById('lang-text');
        if (isRtl) { flagImg.src = 'https://upload.wikimedia.org/wikipedia/commons/a/a4/Flag_of_the_United_States.svg'; flagImg.alt = 'English'; langText.innerText = 'אנגלית'; } 
        else { flagImg.src = 'https://upload.wikimedia.org/wikipedia/commons/d/d4/Flag_of_Israel.svg'; flagImg.alt = 'Hebrew'; langText.innerText = 'Hebrew'; }
        document.querySelectorAll('[data-i18n]').forEach(el => { const key = el.getAttribute('data-i18n'); if (i18n_dict[lang][key]) { el.innerHTML = i18n_dict[lang][key]; } });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const key = el.getAttribute('data-i18n-placeholder'); if (i18n_dict[lang][key]) { el.placeholder = i18n_dict[lang][key]; } });
    }
    function toggleLanguage() { const currentLang = localStorage.getItem('site_lang') || 'he'; const newLang = currentLang === 'he' ? 'en' : 'he'; applyLanguage(newLang); }
    function toggleDarkMode() {
        const body = document.body;
        if (body.classList.contains('dark-mode')) { body.classList.remove('dark-mode'); localStorage.setItem('site_theme', 'light'); } 
        else { body.classList.add('dark-mode'); localStorage.setItem('site_theme', 'dark'); }
    }
    function toggleAccessibilityMenu() {
        const menu = document.getElementById('acc-main-menu');
        const toggle = document.getElementById('acc-floating-toggle');
        if (!menu || !toggle) return;
        if (menu.style.display === 'none' || menu.style.display === '') {
            menu.style.display = 'block';
            toggle.style.display = 'none';
            toggle.setAttribute('aria-expanded', 'true');
            const firstFocusable = menu.querySelector('[tabindex="0"], button');
            if (firstFocusable) {
                setTimeout(() => firstFocusable.focus(), 20);
            }
        } else {
            menu.style.display = 'none';
            toggle.style.display = 'flex';
            toggle.setAttribute('aria-expanded', 'false');
            setTimeout(() => toggle.focus(), 20);
        }
    }
    function toggleAccSubMenu(id) {
        const submenu = document.getElementById(id);
        if (!submenu) return;
        const isOpen = submenu.style.display === 'block';
        submenu.style.display = isOpen ? 'none' : 'block';
    }
    
    let currentZoom = 1.0; 
    function changeFontSize(step) { currentZoom += step; if (currentZoom < 0.8) currentZoom = 0.8; if (currentZoom > 2.2) currentZoom = 2.2; document.documentElement.style.fontSize = (currentZoom * 100) + '%'; }
    function resetFontSize() { currentZoom = 1.0; document.documentElement.style.fontSize = '100%'; }
    function toggleA11yClass(className) { document.body.classList.toggle(className); }
    function resetA11y() {
        resetFontSize();
        const isDark = document.body.classList.contains('dark-mode');
        document.body.className = isDark ? 'dark-mode' : '';
    }

    function initAccessibilityKeyboardSupport() {
        const toggle = document.getElementById('acc-floating-toggle');
        const menu = document.getElementById('acc-main-menu');
        if (toggle) {
            toggle.setAttribute('tabindex', '0');
            toggle.setAttribute('role', 'button');
            toggle.setAttribute('aria-label', 'פתיחת תפריט נגישות');
            toggle.setAttribute('aria-controls', 'acc-main-menu');
            toggle.setAttribute('aria-expanded', 'false');
            toggle.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleAccessibilityMenu();
                }
            });
        }

        if (menu) {
            menu.setAttribute('role', 'dialog');
            menu.setAttribute('aria-label', 'תפריט נגישות');

            const headerClickables = menu.querySelectorAll('.acc-header [onclick]');
            headerClickables.forEach(el => {
                el.setAttribute('tabindex', '0');
                el.setAttribute('role', 'button');
                if (!el.getAttribute('aria-label')) {
                    const oc = el.getAttribute('onclick') || '';
                    if (oc.includes('toggleAccessibilityMenu')) {
                        el.setAttribute('aria-label', 'סגור תפריט נגישות');
                    } else if (oc.includes('resetA11y')) {
                        el.setAttribute('aria-label', 'איפוס הגדרות נגישות');
                    }
                }
                el.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        el.click();
                    }
                });
            });

            const listItems = menu.querySelectorAll('.acc-menu-list > li');
            listItems.forEach(li => {
                li.setAttribute('tabindex', '0');
                li.setAttribute('role', 'button');
                li.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        li.click();
                    }
                });
            });
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && menu && menu.style.display === 'block') {
                toggleAccessibilityMenu();
            }
        });
    }

    function openShareModal() {
        const shareData = {
            title: document.title,
            text: 'קראו את התוכן המרתק בספריית לייבוביץ:',
            url: window.location.href
        };

        if (navigator.share) {
            navigator.share(shareData).catch(() => {});
        } else {
            const currentUrl = window.location.href;
            const titleEncoded = encodeURIComponent(document.title);
            const urlEncoded = encodeURIComponent(currentUrl);

            document.getElementById('luxShareUrl').value = currentUrl;
            document.getElementById('shareWhatsapp').href = `https://api.whatsapp.com/send?text=${titleEncoded}%20-%20${urlEncoded}`;
            document.getElementById('shareEmail').href = `mailto:?subject=${titleEncoded}&body=מוזמנים לקרוא:%20${urlEncoded}`;
            document.getElementById('shareFacebook').href = `https://www.facebook.com/sharer/sharer.php?u=${urlEncoded}`;
            document.getElementById('shareTwitter').href = `https://twitter.com/intent/tweet?text=${titleEncoded}&url=${urlEncoded}`;

            var modal = new bootstrap.Modal(document.getElementById('luxShareModal'));
            modal.show();
        }
    }

    function copyShareUrl() {
        const urlInput = document.getElementById('luxShareUrl');
        urlInput.select();
        urlInput.setSelectionRange(0, 99999);
        
        navigator.clipboard.writeText(urlInput.value).then(() => {
            const copyText = document.getElementById('copyText');
            const copyIcon = document.getElementById('copyIcon');
            
            copyText.innerText = 'הועתק בהצלחה!';
            copyIcon.className = 'bi bi-check2-lg';
            
            setTimeout(() => {
                copyText.innerText = 'העתק קישור';
                copyIcon.className = 'bi bi-clipboard';
            }, 2500);
        });
    }

    function getCookieValue(name) {
        const cookieStr = document.cookie || '';
        const parts = cookieStr.split(';');
        for (let i = 0; i < parts.length; i++) {
            const item = parts[i].trim();
            if (item.startsWith(name + '=')) {
                return decodeURIComponent(item.substring(name.length + 1));
            }
        }
        return '';
    }

    function appendSafeUserBubble(chatBox, bubbleClass, text) {
        const div = document.createElement('div');
        div.className = 'nav-chat-bubble ' + bubbleClass;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendBotBubble(chatBox, bubbleClass, id, initialHtml) {
        const div = document.createElement('div');
        div.className = 'nav-chat-bubble ' + bubbleClass;
        div.id = id;
        div.innerHTML = initialHtml;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }

    function buildAiRequestHeaders() {
        const headers = { 'Content-Type': 'application/json' };
        const csrfToken = getCookieValue('csrftoken');
        if (csrfToken) {
            headers['X-CSRFToken'] = csrfToken;
        }
        return headers;
    }

    async function sendGlobalNavMessage() {
        const inputField = document.getElementById('globalNavInput');
        const chatBox = document.getElementById('globalNavChatBox');
        const userText = inputField.value.trim();

        if (userText === '') return;

        appendSafeUserBubble(chatBox, 'nav-chat-user', userText);
        inputField.value = '';

        const typingId = 'nav-typing-' + Date.now();
        const aiTitle = '<strong style="font-size: 1.15em; color: #2575fc;">עוזר הניווט הדיגיטלי:</strong><br><br>';
        const botBubble = appendBotBubble(
            chatBox,
            'nav-chat-bot',
            typingId,
            `${aiTitle} <div class="nav-loading-status"><div class="nav-spinner" style="border-top-color: #2575fc;"></div><span id="nav-status-text-${typingId}">מאתר את העמוד הרלוונטי...</span></div>`
        );

        try {
            const response = await fetch('/api/ai-chat/', {
                method: 'POST',
                credentials: 'same-origin',
                headers: buildAiRequestHeaders(),
                body: JSON.stringify({ question: userText, mode: 'nav' })
            });

            if (!response.ok) {
                botBubble.innerHTML = `${aiTitle}מצטער, הייתה בעיה זמנית בעיבוד השאלה.`;
                return;
            }

            botBubble.innerHTML = aiTitle;

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let done = false;

            while (!done) {
                const { value, done: readerDone } = await reader.read();
                done = readerDone;
                if (value) {
                    const chunk = decoder.decode(value, { stream: true });
                    botBubble.insertAdjacentHTML('beforeend', chunk.replace(/\n/g, '<br>'));
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            }
        } catch (error) {
            botBubble.innerHTML = `${aiTitle}מצטער, אירעה שגיאת רשת זמנית.`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendQAMessage() {
        const inputField = document.getElementById('globalQAInput');
        const chatBox = document.getElementById('globalQAChatBox');
        const userText = inputField.value.trim();

        if (userText === '') return;

        appendSafeUserBubble(chatBox, 'qa-chat-user', userText);
        inputField.value = '';

        const typingId = 'qa-typing-' + Date.now();
        const aiTitle = '<strong style="font-size: 1.15em; color: #1e202c;">שאל את ה-AI מבוסס על התכנים שבאתר <span style="font-weight: normal; font-size: 0.85em;">(אין לסמוך על תשובות ה- AI למעשה)</span>:</strong><br><br>';
        const botBubble = appendBotBubble(
            chatBox,
            'qa-chat-bot',
            typingId,
            `${aiTitle} <div class="nav-loading-status" style="color: #d4af37;"><div class="nav-spinner" style="border-top-color: #d4af37;"></div><span id="qa-status-text-${typingId}">🧠 מנתח את ההקשר ההלכתי של הטקסט...</span></div>`
        );

        const loadingMessages = ["🧠 מנתח את ההקשר ההלכתי של הטקסט...", "📚 סורק מקורות ופסקי הלכה...", "✍️ מנסח תשובה ברורה ומדויקת..."];
        let messageIndex = 0;
        const loadingInterval = setInterval(() => {
            messageIndex = (messageIndex + 1) % loadingMessages.length;
            const statusElement = document.getElementById(`qa-status-text-${typingId}`);
            if (statusElement) { statusElement.innerText = loadingMessages[messageIndex]; }
        }, 2000);

        try {
            const response = await fetch('/api/ai-chat/', {
                method: 'POST',
                credentials: 'same-origin',
                headers: buildAiRequestHeaders(),
                body: JSON.stringify({ question: userText, mode: 'qa' })
            });

            clearInterval(loadingInterval);

            if (!response.ok) {
                botBubble.innerHTML = `${aiTitle}מצטער, הייתה בעיה זמנית בעיבוד השאלה.`;
                return;
            }

            botBubble.innerHTML = aiTitle;

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let done = false;

            while (!done) {
                const { value, done: readerDone } = await reader.read();
                done = readerDone;
                if (value) {
                    const chunk = decoder.decode(value, { stream: true });
                    botBubble.insertAdjacentHTML('beforeend', chunk.replace(/\n/g, '<br>'));
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            }
        } catch (error) {
            clearInterval(loadingInterval);
            botBubble.innerHTML = `${aiTitle}מצטער, אירעה שגיאת רשת זמנית.`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById('globalNavInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') sendGlobalNavMessage(); });
    document.getElementById('globalQAInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') sendQAMessage(); });

    document.addEventListener('DOMContentLoaded', () => {
        initAccessibilityKeyboardSupport();

        const savedLang = localStorage.getItem('site_lang') || 'he';
        if(savedLang !== 'he') { applyLanguage(savedLang); }
        const savedTheme = localStorage.getItem('site_theme');
        if (savedTheme === 'dark') { document.body.classList.add('dark-mode'); }
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        window.addEventListener('scroll', function() { if (window.pageYOffset > 300) { scrollTopBtn.classList.add('show'); } else { scrollTopBtn.classList.remove('show'); } });
        scrollTopBtn.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });
        const observerOptions = { root: null, rootMargin: '0px', threshold: 0.1 };
        const observer = new IntersectionObserver((entries, observer) => { entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('is-visible'); observer.unobserve(entry.target); } }); }, observerOptions);
        document.querySelectorAll('.reveal-up').forEach((el) => { observer.observe(el); });
        
        const dragEl = document.getElementById('draggableQaPill');
        let isDragging = false, isClick = true;
        let currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;
        
        function dragStart(e) {
            if (e.type === "touchstart") { initialX = e.touches[0].clientX - xOffset; initialY = e.touches[0].clientY - yOffset; } 
            else { initialX = e.clientX - xOffset; initialY = e.clientY - yOffset; }
            if (e.target === dragEl || dragEl.contains(e.target)) {
                isDragging = true; isClick = true;
            }
        }

        function dragEnd(e) {
            initialX = currentX; initialY = currentY; isDragging = false;
        }

        function drag(e) {
            if (isDragging) {
                e.preventDefault(); isClick = false; 
                if (e.type === "touchmove") { currentX = e.touches[0].clientX - initialX; currentY = e.touches[0].clientY - initialY; } 
                else { currentX = e.clientX - initialX; currentY = e.clientY - initialY; }
                xOffset = currentX; yOffset = currentY;
                setTranslate(currentX, currentY, dragEl);
            }
        }

        function setTranslate(xPos, yPos, el) { el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`; }

        document.addEventListener("touchstart", dragStart, {passive: false});
        document.addEventListener("touchend", dragEnd, {passive: false});
        document.addEventListener("touchmove", drag, {passive: false});

        document.addEventListener("mousedown", dragStart);
        document.addEventListener("mouseup", dragEnd);
        document.addEventListener("mousemove", drag);
        
        dragEl.addEventListener('click', function(e) {
            if (isClick) {
                var aiModal = new bootstrap.Modal(document.getElementById('aiQAModal'));
                aiModal.show();
            } else {
                e.preventDefault(); e.stopPropagation();
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(function() {});
        }

        ['aiQAModal', 'aiGlobalNavModal', 'luxShareModal'].forEach(function(modalId) {
            var mEl = document.getElementById(modalId);
            if (!mEl || mEl.__focusManagerBound) return;
            mEl.__focusManagerBound = true;
            mEl.addEventListener('show.bs.modal', function(e) {
                var opener = e.relatedTarget || document.activeElement;
                if (opener && opener !== document.body && opener !== document.documentElement && !mEl.contains(opener)) {
                    mEl.__returnFocusEl = opener;
                }
            });
            mEl.addEventListener('hide.bs.modal', function() {
                if (document.activeElement && mEl.contains(document.activeElement)) {
                    document.activeElement.blur();
                }
            });
            mEl.addEventListener('hidden.bs.modal', function() {
                var target = mEl.__returnFocusEl;
                mEl.__returnFocusEl = null;
                if (target && target.isConnected && typeof target.focus === 'function') {
                    window.requestAnimationFrame(function() {
                        if (target.isConnected) {
                            target.focus();
                        }
                    });
                }
            });
        });
    });

    window.addEventListener('scroll', function() {
        const winScroll = document.body.scrollTop || document.documentElement.scrollTop; const height = document.documentElement.scrollHeight - document.documentElement.clientHeight; let scrolled = 0;
        if (height > 0) { scrolled = (winScroll / height) * 100; }
        const progressBar = document.getElementById("reading-progress-bar"); if (progressBar) { progressBar.style.width = scrolled + "%"; }
    });
</script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        let badgeTicks = 0;
        const breakOutInterval = setInterval(() => {
            badgeTicks += 1;
            const badge = document.querySelector('.grecaptcha-badge');
            if (badge) {
                clearInterval(breakOutInterval);
                if (badge.parentElement !== document.body) { document.body.appendChild(badge); }
            } else if (badgeTicks >= 50) {
                clearInterval(breakOutInterval);
            }
        }, 100);
    });
</script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const popup = document.createElement('div');
        popup.className = 'lux-footnote-popup';
        document.body.appendChild(popup);

        let activeLink = null;

        function resolveAnchorTarget(targetId) {
            if (!targetId) return null;
            const byId = document.getElementById(targetId);
            if (byId) return byId;
            try {
                return document.querySelector(`a[name="${CSS.escape(targetId)}"]`);
            } catch (err) {
                return document.querySelector(`a[name="${targetId}"]`);
            }
        }

        function resolveHighlightContainer(targetEl) {
            if (!targetEl) return null;
            const tag = targetEl.tagName.toLowerCase();
            if ((tag === 'a' || tag === 'span') && targetEl.parentElement) {
                const parentTag = targetEl.parentElement.tagName.toLowerCase();
                if (parentTag === 'p' || parentTag === 'li' || parentTag === 'div') {
                    return targetEl.parentElement;
                }
            }
            return targetEl;
        }

        function scrollAndPulseTarget(targetEl, targetId) {
            if (!targetEl) return;
            const container = resolveHighlightContainer(targetEl);
            container.scrollIntoView({ behavior: 'smooth', block: 'center' });
            if (targetId && window.history && window.history.replaceState) {
                window.history.replaceState(null, '', '#' + targetId);
            }
            container.classList.remove('footnote-target-pulse');
            void container.offsetWidth;
            container.classList.add('footnote-target-pulse');
            if (typeof targetEl.focus === 'function') {
                if (!targetEl.hasAttribute('tabindex') && targetEl.tagName.toLowerCase() !== 'a') {
                    targetEl.setAttribute('tabindex', '-1');
                }
                targetEl.focus({ preventScroll: true });
            }
        }

        const footnoteLinks = document.querySelectorAll('a[href^="#"]');

        footnoteLinks.forEach(link => {
            const hrefVal = link.getAttribute('href') || '';
            const targetId = hrefVal.substring(1);
            if (!targetId) return;

            const targetElement = resolveAnchorTarget(targetId);
            if (!targetElement) return;

            const isFootnoteNav =
                link.classList.contains('footnote-ref') ||
                link.classList.contains('footnote-backref') ||
                /^(?:fn-(?:note|ref)-|footnote-|_?ftn|_?edn)/i.test(targetId);

            const isBackref =
                link.classList.contains('footnote-backref') ||
                /^(?:fn-ref-|footnote-ref-|_?ftnref|_?ednref)/i.test(targetId);

            const showPopup = () => {
                if (isBackref) return;
                const contentNode = resolveHighlightContainer(targetElement);
                const clone = contentNode.cloneNode(true);
                clone.querySelectorAll('a[href^="#"]').forEach(bl => bl.remove());
                const previewHtml = clone.innerHTML.trim();
                if (!previewHtml) return;

                popup.innerHTML = previewHtml;
                activeLink = link;

                const rect = link.getBoundingClientRect();
                let top = rect.top + window.scrollY - popup.offsetHeight - 15;
                let left = rect.left + window.scrollX + (rect.width / 2) - (popup.offsetWidth / 2);

                if (top < window.scrollY) {
                    top = rect.bottom + window.scrollY + 15;
                }
                if (left < 10) left = 10;
                if (left + popup.offsetWidth > window.innerWidth - 10) {
                    left = window.innerWidth - popup.offsetWidth - 10;
                }

                popup.style.top = top + 'px';
                popup.style.left = left + 'px';
                popup.classList.add('show');
            };

            const hidePopup = () => {
                popup.classList.remove('show');
                activeLink = null;
            };

            if (!isBackref) {
                link.addEventListener('mouseenter', showPopup);
                link.addEventListener('mouseleave', hidePopup);
            }

            link.addEventListener('click', (e) => {
                if (isFootnoteNav) {
                    e.preventDefault();
                    hidePopup();
                    scrollAndPulseTarget(targetElement, targetId);
                    return;
                }
                if (activeLink !== link) {
                    e.preventDefault();
                    showPopup();
                } else {
                    hidePopup();
                }
            });
        });

        if (window.location.hash && window.location.hash.length > 1) {
            const initialId = decodeURIComponent(window.location.hash.substring(1));
            const initialTarget = resolveAnchorTarget(initialId);
            if (initialTarget && /^(?:fn-(?:note|ref)-|footnote-)/i.test(initialId)) {
                setTimeout(() => scrollAndPulseTarget(initialTarget, initialId), 150);
            }
        }

        document.addEventListener('click', (e) => {
            if (activeLink && !activeLink.contains(e.target) && !popup.contains(e.target)) {
                popup.classList.remove('show');
                activeLink = null;
            }
        });

        window.addEventListener('scroll', () => {
            if (popup.classList.contains('show') && activeLink) {
                popup.classList.remove('show');
                activeLink = null;
            }
        }, { passive: true });
    });
</script>

        };

        const hebrewPrefixes = ['לכש', 'וכ', 'וש', 'מה', 'שה', 'וד', 'ו', 'ב', 'ל', 'מ', 'ש', 'ה', 'ד'];
        const singleQuoteAllowedPrefixes = {
            "עי'": ['ו'],
            "נר'": ['ו', 'ש', 'ד'],
            "בעי'": ['ו', 'ד', 'ש'],
            "דאו'": ['ו', 'ב', 'ל', 'מ', 'ש', 'ד', 'מה', 'שה'],
            "הל'": ['ו', 'ב', 'מ'],
            "סנ'": ['ו', 'ב'],
            "פס'": ['ו', 'ב'],
            "וכו'": ['ו']
        };

        function resolveAcronymMeaning(normalizedWord) {
            if (acronymDict[normalizedWord]) {
                return acronymDict[normalizedWord];
            }
            if (normalizedWord.length <= 2) {
                return null;
            }
            for (let prefix of hebrewPrefixes) {
                if (!normalizedWord.startsWith(prefix)) continue;
                const baseWord = normalizedWord.substring(prefix.length);
                if (!acronymDict[baseWord]) continue;
                if (baseWord.includes('"')) {
                    return acronymDict[baseWord];
                }
                const allowed = singleQuoteAllowedPrefixes[baseWord];
                if (allowed && allowed.includes(prefix)) {
                    return acronymDict[baseWord];
                }
            }
            return null;
        }

        function walkTextNodes(node) {
            let next;
            if (node.nodeType === 1) {
                const tag = node.nodeName;
                if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'A' || node.classList.contains('lux-acronym')) {
                    return;
                }
                for (let child = node.firstChild; child; child = next) {
                    next = child.nextSibling;
                    walkTextNodes(child);
                }
            } else if (node.nodeType === 3) {
                const text = node.nodeValue;
                const regex = /([א-ת]+["'״”“]+[א-ת]+|[א-ת]+['׳`])/g;
                let match;
                let lastIndex = 0;
                let hasMatch = false;
                const fragment = document.createDocumentFragment();

                while ((match = regex.exec(text)) !== null) {
                    let word = match[0];
                    let normalizedWord = word.replace(/['׳`]/g, "'").replace(/["״”“]/g, '"');
                    let meaning = resolveAcronymMeaning(normalizedWord);

                    if (meaning) {
                        hasMatch = true;
                        fragment.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));
                        
                        const span = document.createElement('span');
                        span.className = 'lux-acronym';
                        span.setAttribute('data-meaning', meaning);
                        span.textContent = word;
                        fragment.appendChild(span);
                        
                        lastIndex = regex.lastIndex;
                    }
                }
                
                if (hasMatch) {
                    fragment.appendChild(document.createTextNode(text.substring(lastIndex)));
                    node.parentNode.replaceChild(fragment, node);
                }
            }
        }

        const contentAreas = document.querySelectorAll('.article-content');
        contentAreas.forEach(area => walkTextNodes(area));
    });
