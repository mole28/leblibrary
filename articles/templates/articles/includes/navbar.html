<header class="top-navbar">
    <div class="nav-aligned-container">
        
        <div class="mobile-nav-header">
            <a class="nav-logo" href="{% url 'articles:list' %}" data-i18n="site_title">דף הבית</a>
            
            <button class="custom-hamburger" type="button" onclick="document.getElementById('navbarCollapseContent').classList.toggle('show')">
                <i class="bi bi-list"></i>
            </button>
        </div>
        
        <div class="collapse" id="navbarCollapseContent">
            
            <span class="nav-separator"></span> 
            <a class="nav-link-custom {% if current_page == 'books' %}active{% endif %}" href="{% url 'articles:books' %}">
                <i class="bi bi-book"></i> <span data-i18n="nav_books">ספרים</span>
            </a>
            
            <span class="nav-separator"></span> 
            <a class="nav-link-custom {% if current_page == 'qa' %}active{% endif %}" href="{% url 'articles:qa' %}">
                <i class="bi bi-chat-right-text"></i> <span data-i18n="nav_qa">שאלות ותשובות</span>
            </a>
            
            <span class="nav-separator"></span> 
            <a class="nav-link-custom {% if current_page == 'articles' %}active{% endif %}" href="{% url 'articles:articles_index' %}">
                <i class="bi bi-file-earmark-text"></i> <span data-i18n="nav_articles">מאמרים</span>
            </a>
            
            <span class="nav-separator"></span> 
            <a class="nav-link-custom {% if current_page == 'parasha' %}active{% endif %}" href="{% url 'articles:parasha' %}">
                <i class="bi bi-calendar-event"></i> <span data-i18n="nav_parasha">פרשת שבוע</span>
            </a>
            
            <span class="nav-separator"></span> 
            <a class="nav-link-custom {% if current_page == 'contact' %}active{% endif %}" href="{% url 'articles:contact' %}">
                <i class="bi bi-envelope"></i> <span data-i18n="nav_contact">צור קשר</span>
            </a>

            <span class="nav-separator"></span> 
            <a class="nav-link-custom {% if current_page == 'advanced_search' %}active{% endif %}" href="{% url 'articles:advanced_search' %}" style="color: #d4af37;">
                <i class="bi bi-gem"></i> <span>חיפוש מתקדם</span>
            </a>

            <div class="nav-left-absolute">
                
                <button class="header-share-btn" onclick="openShareModal()" title="שיתוף העמוד">
                    <i class="bi bi-share-fill"></i>
                </button>

                <a href="{% url 'articles:cart_detail' %}" class="cart-icon-btn" title="עגלת קניות">
                    <i class="bi bi-cart3"></i>
                </a>

                <button id="darkModeToggleBtn" class="dark-mode-toggle-btn" onclick="toggleDarkMode()" title="החלף עיצוב (מצב לילה/יום)">
                    <i class="bi bi-circle-half" id="darkModeIcon"></i>
                </button>
                
                <div class="rights-text" data-i18n="footer_rights">כל הזכויות שמורות<br>למשה לייבוביץ</div>
                
                <button id="lang-toggle-btn" class="lang-btn-custom" onclick="toggleLanguage()">
                    <img id="lang-flag-img" src="https://upload.wikimedia.org/wikipedia/commons/a/a4/Flag_of_the_United_States.svg" alt="English" class="lang-flag-custom">
                    <span id="lang-text" class="lang-text-custom">אנגלית</span>
                </button>
            </div>
        </div>

    </div>
</header>
